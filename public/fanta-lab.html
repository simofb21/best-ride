<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#173d2b" />
    <title>Asta Fantacalcio</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      :root {
        --ink: #142019;
        --muted: #68746d;
        --paper: #f4f7f2;
        --card: #fff;
        --line: #dde5de;
        --brand: #173d2b;
        --lime: #d8f27d;
        --danger: #b42318;
        --top: #173d2b;
        --semi: #36745a;
        --third: #e9bd56;
        --fourth: #d9e0dc;
        --bet: #b9a4ed;
        --avoid: #ef9a91;
        --shadow: 0 8px 24px rgba(18, 47, 33, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--paper);
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .app {
        max-width: 1180px;
        margin: auto;
        min-height: 100dvh;
        padding-bottom: 86px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(244, 247, 242, 0.92);
        backdrop-filter: blur(14px);
        padding: 16px 16px 8px;
        border-bottom: 1px solid rgba(221, 229, 222, 0.8);
      }
      .brandline {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      .brand h1 {
        font-size: 20px;
        margin: 0;
        letter-spacing: -0.5px;
      }
      .brand h1 small {
        font-size: 8px;
        letter-spacing: 0.08em;
        background: var(--lime);
        color: #294008;
        border-radius: 999px;
        padding: 4px 6px;
        vertical-align: middle;
        margin-left: 5px;
      }
      .brand p {
        font-size: 12px;
        color: var(--muted);
        margin: 2px 0 0;
      }
      .pill {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 999px;
        padding: 8px 11px;
        font-weight: 800;
        font-size: 12px;
        white-space: nowrap;
      }
      .rolebar {
        display: flex;
        gap: 7px;
        overflow: auto;
        padding: 12px 0 2px;
        scrollbar-width: none;
      }
      .rolebar::-webkit-scrollbar {
        display: none;
      }
      .role-btn {
        border: 0;
        background: #e7ede8;
        color: #496056;
        padding: 9px 14px;
        border-radius: 999px;
        font-weight: 800;
        white-space: nowrap;
      }
      .role-btn.active {
        background: var(--brand);
        color: #fff;
      }
      main {
        padding: 14px 14px 30px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .search {
        position: relative;
        flex: 1;
      }
      .search input {
        width: 100%;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 14px;
        padding: 12px 13px 12px 38px;
        outline: none;
      }
      .search:before {
        content: "⌕";
        position: absolute;
        left: 13px;
        top: 7px;
        font-size: 24px;
        color: var(--muted);
      }
      .icon-btn {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 14px;
        padding: 11px 13px;
        font-weight: 800;
      }
      .icon-btn.on {
        background: var(--lime);
        border-color: #bad85e;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 13px;
        border-bottom: 1px solid var(--line);
      }
      .panel-title h2 {
        font-size: 14px;
        margin: 0;
      }
      .panel-title span {
        font-size: 11px;
        color: var(--muted);
      }
      .tiers {
        padding: 8px;
      }
      .tier {
        margin-bottom: 8px;
      }
      .tier:last-child {
        margin-bottom: 0;
      }
      .tier-label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 5px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 10px;
        font-weight: 900;
        color: var(--muted);
      }
      .tier-label:after {
        content: "";
        height: 1px;
        background: var(--line);
        flex: 1;
      }
      .players {
        display: grid;
        gap: 7px;
      }
      .player {
        width: 100%;
        text-align: left;
        border: 1px solid var(--line);
        border-left: 6px solid var(--fourth);
        background: #fff;
        border-radius: 12px;
        padding: 10px;
        transition: 0.15s;
      }
      .player-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }
      .player[data-tier="top"] {
        border-left-color: #155b3a;
        background: #f2faf5;
      }
      .player[data-tier="semitop"] {
        border-left-color: #2f8b72;
        background: #f2faf8;
      }
      .player[data-tier="terza"] {
        border-left-color: #d29a1d;
        background: #fffaf0;
      }
      .player[data-tier="quarta"] {
        border-left-color: #89958e;
        background: #f7f9f7;
      }
      .player[data-tier="secondi"] {
        border-left-color: #54719d;
        background: #f4f7fb;
      }
      .player[data-tier="scommessa"] {
        border-left-color: #8064c5;
        background: #f8f5ff;
      }
      .player[data-tier="evitare"] {
        border-left-color: #c4473d;
        background: #fff5f4;
      }
      .player.sold {
        opacity: 0.6;
        background: #eef1ee;
      }
      .player-name {
        font-weight: 900;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-transform: uppercase;
      }
      .player-meta {
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-transform: none;
      }
      .price {
        min-width: 48px;
        text-align: center;
        align-self: center;
        background: #edf2ee;
        border-radius: 10px;
        padding: 7px 6px;
        font-weight: 900;
        font-size: 13px;
      }
      .price small {
        display: block;
        color: var(--muted);
        font-size: 8px;
        font-weight: 700;
      }
      .badges {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .badge {
        font-size: 9px;
        padding: 4px 6px;
        border-radius: 999px;
        background: #eff3ef;
        color: #4f6157;
        font-weight: 800;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .player-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .player-actions button {
        flex: 1;
        border: 1px solid var(--line);
        background: #f1f4f1;
        color: var(--ink);
        border-radius: 10px;
        padding: 8px 6px;
        font-weight: 850;
        font-size: 11.5px;
      }
      .player-actions button:active {
        transform: scale(0.97);
      }
      .player-actions .p-buy {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
      }
      .player-actions .p-sold {
        background: #e2e8e3;
        color: #496056;
      }
      .status-good {
        background: #bce8c8;
        color: #14532d;
      }
      .status-ok {
        background: #dcf3c0;
        color: #365314;
      }
      .status-warn {
        background: #ffecad;
        color: #704f00;
      }
      .status-bad {
        background: #ffd0cc;
        color: #8b1e17;
      }
      .status-neutral {
        background: #edf1ee;
        color: #607067;
      }
      .badge.carmy {
        background: #173d2b;
        color: #fff;
      }
      .badge.carmy-esca {
        background: #d36b13;
        color: #fff;
      }
      .badge.franco {
        background: #2459a6;
        color: #fff;
      }
      .tier[data-tier="top"] .tier-label {
        color: #155b3a;
      }
      .tier[data-tier="semitop"] .tier-label {
        color: #2f8b72;
      }
      .tier[data-tier="terza"] .tier-label {
        color: #9a6900;
      }
      .tier[data-tier="quarta"] .tier-label {
        color: #68746d;
      }
      .tier[data-tier="scommessa"] .tier-label {
        color: #6743bc;
      }
      .teams-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .team-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 13px;
        box-shadow: var(--shadow);
        text-align: left;
        width: 100%;
        cursor: pointer;
      }
      .team-card:active {
        transform: scale(0.985);
      }
      .team-card.mine {
        border: 2px solid var(--brand);
      }
      .team-name {
        display: flex;
        justify-content: space-between;
        gap: 5px;
        font-size: 13px;
        font-weight: 850;
      }
      .money {
        font-size: 26px;
        font-weight: 950;
        letter-spacing: -1px;
        margin: 8px 0;
      }
      .money small {
        font-size: 11px;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0;
      }
      .progress {
        height: 6px;
        background: #e9eeea;
        border-radius: 99px;
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--brand);
      }
      .team-foot {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 10px;
        margin-top: 7px;
      }
      .roster-chips {
        display: flex;
        gap: 4px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .roster-chips span {
        font-size: 9px;
        background: #edf2ee;
        border-radius: 6px;
        padding: 4px 5px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 36px 20px;
      }
      .section-title {
        font-size: 18px;
        margin: 4px 0 12px;
      }
      .history {
        display: grid;
        gap: 7px;
      }
      .history-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        background: #fff;
        border: 1px solid var(--line);
        padding: 11px;
        border-radius: 12px;
      }
      .history-row b {
        font-size: 13px;
      }
      .history-row small {
        display: block;
        color: var(--muted);
        margin-top: 3px;
      }
      .history-price {
        font-weight: 900;
      }
      .undo {
        border: 0;
        background: #ffe2df;
        color: var(--danger);
        border-radius: 9px;
        padding: 6px 8px;
        font-size: 11px;
        font-weight: 800;
        margin-top: 5px;
      }
      .editor-grid {
        display: grid;
        gap: 12px;
      }
      .edit-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
      }
      .edit-card h3 {
        font-size: 14px;
        margin: 0 0 11px;
      }
      .field {
        display: grid;
        gap: 5px;
        margin-bottom: 9px;
      }
      .field label {
        font-size: 10px;
        font-weight: 850;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 10px;
        background: #fff;
        outline: none;
      }
      .field textarea {
        min-height: 75px;
        resize: vertical;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .team-input {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 7px;
        margin-bottom: 6px;
      }
      .team-input input {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px;
      }
      .mine-btn {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        padding: 8px;
      }
      .mine-btn.active {
        background: var(--lime);
        border-color: #b9d35e;
      }
      .primary,
      .secondary,
      .danger {
        border: 0;
        border-radius: 12px;
        padding: 11px 14px;
        font-weight: 850;
      }
      .primary {
        background: var(--brand);
        color: #fff;
      }
      .secondary {
        background: #edf2ee;
        color: var(--ink);
      }
      .danger {
        background: #ffe2df;
        color: var(--danger);
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .full {
        width: 100%;
      }
      .team-picker {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
        margin: 8px 0 14px;
      }
      .team-radio {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .team-pick {
        display: block;
        text-align: center;
        cursor: pointer;
        border: 1px solid var(--line);
        background: #f5f7f5;
        border-radius: 11px;
        padding: 9px 4px;
        font-size: 11px;
        font-weight: 900;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .team-pick small {
        display: block;
        font-size: 8px;
        color: var(--muted);
        margin-top: 2px;
      }
      .team-radio:checked + .team-pick {
        background: var(--lime);
        border-color: #829e2d;
        color: #213400;
        box-shadow:
          inset 0 0 0 2px #fff,
          0 0 0 2px #829e2d;
      }
      .team-radio:focus-visible + .team-pick {
        outline: 3px solid #9bb7ff;
      }
      .quick-prices {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin: -2px 0 10px;
      }
      .quick-prices button {
        border: 1px solid var(--line);
        background: #f1f4f1;
        border-radius: 9px;
        padding: 7px 4px;
        font-size: 10px;
        font-weight: 850;
      }
      .buy-player-info {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: #f4f7f4;
        border-radius: 12px;
        padding: 10px 11px;
        margin-bottom: 12px;
      }
      .buy-player-info b {
        text-transform: capitalize;
      }
      .buy-player-info small {
        color: var(--muted);
      }
      nav {
        position: fixed;
        z-index: 30;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(14px);
        border-top: 1px solid var(--line);
        padding: 7px max(10px, env(safe-area-inset-right))
          calc(7px + env(safe-area-inset-bottom))
          max(10px, env(safe-area-inset-left));
        display: flex;
        justify-content: center;
        gap: 4px;
      }
      .nav-btn {
        flex: 1;
        max-width: 180px;
        border: 0;
        background: transparent;
        border-radius: 12px;
        padding: 8px 6px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 850;
      }
      .nav-btn b {
        display: block;
        font-size: 18px;
        line-height: 1.05;
        margin-bottom: 2px;
      }
      .nav-btn.active {
        background: #e8efe9;
        color: var(--brand);
      }
      dialog {
        border: 0;
        border-radius: 22px;
        padding: 0;
        width: min(92vw, 460px);
        max-height: 90dvh;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
      }
      dialog::backdrop {
        background: rgba(12, 25, 18, 0.55);
        backdrop-filter: blur(3px);
      }
      .modal {
        padding: 18px;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 14px;
      }
      .modal h2 {
        margin: 0;
        font-size: 21px;
        letter-spacing: -0.5px;
      }
      .modal .subtitle {
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
      }
      .close {
        border: 0;
        background: #edf2ee;
        border-radius: 50%;
        width: 34px;
        height: 34px;
        font-size: 17px;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
        margin: 12px 0;
      }
      .detail {
        background: #f4f7f4;
        border-radius: 11px;
        padding: 9px;
      }
      .detail small {
        display: block;
        color: var(--muted);
        font-size: 9px;
        text-transform: uppercase;
        font-weight: 850;
      }
      .detail b {
        display: block;
        font-size: 12px;
        margin-top: 3px;
      }
      .note {
        background: #f6f7ef;
        border: 1px solid #e9ead7;
        border-radius: 12px;
        padding: 11px;
        font-size: 12px;
        line-height: 1.45;
        margin: 10px 0;
      }
      .toast {
        position: fixed;
        z-index: 99;
        left: 50%;
        bottom: 88px;
        transform: translate(-50%, 25px);
        opacity: 0;
        background: #15261c;
        color: #fff;
        border-radius: 999px;
        padding: 10px 15px;
        font-size: 12px;
        font-weight: 800;
        transition: 0.2s;
        pointer-events: none;
      }
      .toast.show {
        transform: translate(-50%, 0);
        opacity: 1;
      }
      @media (min-width: 760px) {
        header {
          padding-inline: 24px;
        }
        main {
          padding: 20px 24px;
        }
        .players {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .teams-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .editor-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 380px) {
        .panel-title {
          padding: 10px 8px;
        }
        .panel-title span {
          display: none;
        }
        .tiers {
          padding: 5px;
        }
        .player {
          padding: 8px 7px;
          gap: 4px;
        }
        .player-name {
          font-size: 12px;
        }
        .player-meta {
          font-size: 9px;
        }
        .price {
          min-width: 39px;
          padding: 6px 3px;
          font-size: 11px;
        }
        .badges {
          gap: 3px;
        }
        .badge {
          font-size: 7.5px;
          padding: 3px 4px;
        }
        .teams-grid {
          gap: 7px;
        }
        .team-card {
          padding: 10px;
        }
        .money {
          font-size: 22px;
        }
        .team-picker {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brandline">
          <div class="brand">
            <h1>Fanta Asta <small>DEFINITIVA 02/09</small></h1>
            <p id="headline">Liste e fasce</p>
          </div>
          <div class="pill" id="myBudget">700 cr</div>
        </div>
        <div class="rolebar" id="rolebar"></div>
      </header>
      <main id="main"></main>
    </div>
    <nav id="nav"></nav>
    <dialog id="playerDialog"></dialog>
    <dialog id="purchaseDialog"></dialog>
    <div class="toast" id="toast"></div>
    <script>
      const INITIAL = {
        version: 4,
        players: [
          {
            id: "p-svilar-0",
            role: "P",
            tier: "top",
            name: "SVILAR",
            club: "Roma",
            credits: 77,
            originalCredits: 55,
            info: "",
            injuries: "",
            starter: "",
            recommended: "",
            franco: "",
            backup: "Gollini",
            pairing: "Bologna, Monza, Venezia, Genoa",
          },
          {
            id: "p-vicario-1",
            role: "P",
            tier: "top",
            name: "VICARIO",
            club: "Juve",
            credits: 63,
            originalCredits: 45,
            info: "",
            injuries: "",
            starter: "",
            recommended: "",
            franco: "",
            backup: "Grabara per forza",
            pairing: "Bologna, Cagliari, Torino, Lazio",
          },
          {
            id: "p-butez-2",
            role: "P",
            tier: "top",
            name: "BUTEZ",
            club: "Como",
            credits: 60.2,
            originalCredits: 43,
            info: "",
            injuries: "",
            starter: "",
            recommended: "",
            franco: "",
            backup: "Sanchez",
            pairing: "Bologna, Udinese, Sassuolo, Torino",

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORE_KEY));
          if (saved?.data?.version === INITIAL.version) {
            const incomingIds = new Set(INITIAL.players.map((p) => p.id));
            const savedById = new Map(
              (saved.data.players || []).map((p) => [p.id, p]),
            );
            const updated = INITIAL.players.map((p) =>
              savedById.get(p.id)?.custom
                ? { ...p, ...savedById.get(p.id) }
                : p,
            );
            const custom = (saved.data.players || []).filter(
              (p) => !incomingIds.has(p.id),
            );
            saved.data.players = [...updated, ...custom];
            saved.data.pairings = saved.data.pairings?.length
              ? saved.data.pairings
              : INITIAL.pairings;
            return saved;
          }
        } catch (e) {}
        return { data: structuredClone(INITIAL), purchases: {}, history: [] };
      }
      function save() {
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
        updateBudget();
      }
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>'"]/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[c],
        );
      const money = (n) => Number(n || 0).toLocaleString("it-IT");
      const normalizeClubName = (s) => {
        const c = String(s || "")
          .trim()
          .toLowerCase()
          .replace(/(^|[\s'-])\p{L}/gu, (x) => x.toUpperCase());
        return (
          {
            Bolo: "Bologna",

            Forosinnone: "Frosinone",
            Udi: "Udinese",

      function filteredPlayers() {
        const q = ui.search.trim().toLowerCase();
        return state.data.players.filter(
          (p) =>
            p.role === ui.role &&
            (!ui.onlyAvailable || !state.purchases[p.id]) &&
            (!q ||
              [p.name, p.club, p.tier, p.info, p.pairing]
                .join(" ")
                .toLowerCase()
                .includes(q)),
        );
      }
      function statusTone(value, type) {
        const v = String(value || "")
          .toLowerCase()
          .trim();
        if (!v) return "status-neutral";
        if (type === "starter") {
          if (/titolare fisso|titolare sempre|titolarissimo/.test(v))
            return "status-good";
          if (/si alterna|alterna|rotazione/.test(v)) return "status-warn";
          if (/non fisso|non titolar|riserv|riser|risrv/.test(v))
            return "status-bad";
          return "status-ok";
        }
        if (/^(no|no infortuni)|integro/.test(v)) return "status-good";
        if (/pochi|basso/.test(v)) return "status-ok";
        if (/medio|rischio/.test(v)) return "status-warn";
        if (/tanti|alto|rotto|infortunio fino|fragile/.test(v))
          return "status-bad";
        return "status-neutral";
      }
      function carmyLabel(value) {
        const v = String(value || "").trim();
        if (!v) return "";
        return /esca/i.test(v) ? "ESCA" : "SÌ";

        return !!String(value || "").trim();

      function mdCells(line) {
        return line
          .trim()
          .replace(/^\||\|$/g, "")

      function normalizeTierImport(value) {
        const v = String(value || "").toLowerCase();
        if (v.includes("non prendere")) return "evitare";
        if (v.includes("scommess")) return "scommessa";
        if (v.includes("semit")) return "semitop";
        if (v.includes("top")) return "top";
        if (v.includes("terza")) return "terza";
        if (/quart|quarat|wuart/.test(v)) return "quarta";
        if (v.includes("second")) return "secondi";
        return v.trim() || "altro";
      }
      function importMarkdownPlayers(text, role) {
        let rows = text
          .split(/\r?\n/)
          .filter((l) => l.trim().startsWith("|"))
          .map(mdCells)
          .filter((r) => !r.every((c) => /^:?-{3,}:?$/.test(c) || !c));
        if (!rows.length) throw Error("Tabella non trovata");
        const first = rows[0].map((v) => v.toLowerCase());
        const hasHeader =
          first.some((v) =>
            /fascia|giocatore|nome|squadra|crediti|prezzo|titolar|infort/.test(
              v,
            ),
          ) && !/^(top|semitop|terza|quarta|scommess)/.test(first[0]);
        let map = {};
        if (hasHeader) {
          const find = (rx, start = 0) =>
            first.findIndex((v, i) => i >= start && rx.test(v));
          map.tier = find(/fascia|^info$/);
          map.name = find(/nome|giocatore/);
          map.club = find(/squadra/);
          map.credits = find(/credit|prezzo/);
          map.credits700 = find(/su\s*700/);
          map.info = find(/informazioni/, 1);
          if (map.info < 0) map.info = find(/^info$/, 1);
          map.injuries = find(/infort|integr/);
          map.starter = find(/titolar/);
          map.recommended = find(/consigli/);
          map.franco = find(/franco/);
          map.backup = find(/secondo/);
          map.pairing = find(/abbinamento/);
          rows = rows.slice(1);
        } else {
          map =
            role === "D"
              ? {
                  tier: 0,
                  name: 1,
                  club: 2,
                  credits: 3,
                  credits700: 4,
                  info: 5,
                  injuries: 6,
                  starter: 7,
                  recommended: 8,
                  franco: 9,
                }
              : role === "C"
                ? {
                    tier: 0,
                    name: 1,
                    credits: 2,
                    credits700: 3,
                    club: 4,
                    info: 5,
                    starter: 6,
                    injuries: 7,
                    recommended: 8,
                    franco: 9,
                  }
                : role === "A"
                  ? {
                      tier: 0,
                      name: 1,
                      credits: 2,
                      credits700: 3,
                      club: 4,
                      info: 5,
                      injuries: 6,
                      starter: 7,
                      recommended: 8,
                      franco: 9,
                    }
                  : {
                      tier: 0,
                      name: 1,
                      club: 2,
                      credits: 3,
                      credits700: 4,
                      backup: 5,
                      pairing: 6,
                    };
        }
        const val = (row, key) =>
          map[key] >= 0 ? String(row[map[key]] || "").trim() : "";
        const slug = (s) =>
          s
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/(^-|-$)/g, "");
        const num = (v) => {
          const m = String(v || "")
            .replace(",", ".")
            .match(/\d+(?:\.\d+)?/);
          return m ? Number(m[0]) : null;
        };
        return rows
          .map((row, i) => {
            const name = val(row, "name");
            if (!name) return null;
            const originalCredits = num(val(row, "credits")),
              target = num(val(row, "credits700"));
            return {
              id:
                role === "P"
                  ? `p-${slug(name)}-${i}`
                  : `${role}-${slug(name)}-${i}`,
              role,
              tier: normalizeTierImport(val(row, "tier")),
              name: name.toUpperCase(),
              club: normalizeClubName(val(row, "club")),
              credits: target ?? originalCredits,
              originalCredits,
              info: val(row, "info"),
              injuries: val(row, "injuries"),
              starter: val(row, "starter"),
              recommended: val(row, "recommended"),
              franco: val(row, "franco"),
              backup: val(row, "backup"),
              pairing: val(row, "pairing"),
              custom: true,
            };
          })
          .filter(Boolean);
      }

        const mine = e.target.closest("[data-mine]");
        if (mine) {
          state.data.teams.forEach(
            (t, i) => (t.mine = i === Number(mine.dataset.mine)),
          );
          renderEditor();
          return;
        }
        const del = e.target.closest("[data-delete]");
        if (del && confirm("Eliminare questo giocatore?")) {
          state.data.players = state.data.players.filter(
            (p) => p.id !== del.dataset.delete,
          );
          delete state.purchases[del.dataset.delete];
          save();
          document.getElementById("playerDialog").close();
          render();
          toast("Giocatore eliminato");
          return;
        }
      });
      document.addEventListener("submit", (e) => {
        if (e.target.id === "buyForm") {
          e.preventDefault();
          const dialog = document.getElementById("purchaseDialog"),
            id = dialog.dataset.player,
            teamId = new FormData(e.target).get("buyTeam"),
            price = Number(document.getElementById("buyPrice").value),
            team = state.data.teams.find((t) => t.id === teamId);
          if (!team) {
            toast("Scegli una squadra");
            return;
          }
          if (
            price < 1 ||
            price > state.data.settings.budget - teamSpend(teamId)
          ) {
            toast("Prezzo non valido");
            return;
          }
          ui.buyTeam = teamId;
          const item = {
            playerId: id,
            teamId,
            price,
            at: new Date().toISOString(),
          };
          state.purchases[id] = item;
          state.history.push(item);
          save();
          dialog.close();
          render();
          toast(`${team.name}: ${price} crediti`);
        }
        if (e.target.id === "editForm") {
          e.preventDefault();
          const id = document.getElementById("playerDialog").dataset.player,
            p = state.data.players.find((x) => x.id === id);
          Object.assign(p, {
            name: document
              .getElementById("editName")
              .value.trim()
              .toUpperCase(),
            club: normalizeClubName(document.getElementById("editClub").value),
            tier: document.getElementById("editTier").value,
            credits:
              Number(document.getElementById("editCredits").value) || null,
            originalCredits:
              Number(document.getElementById("editOriginalCredits").value) ||
              null,
            franco: document.getElementById("editFranco").value.trim(),
            starter: document.getElementById("editStarter").value.trim(),
            injuries: document.getElementById("editInjuries").value.trim(),
            recommended: document
              .getElementById("editRecommended")
              .value.trim(),
            backup: document.getElementById("editBackup").value.trim(),
            info: document.getElementById("editInfo").value.trim(),
            pairing: document.getElementById("editPairing").value.trim(),
            custom: true,
          });
          save();
          document.getElementById("playerDialog").close();
          render();
          toast("Giocatore aggiornato");
        }
      });
      document.addEventListener("click", (e) => {
        if (e.target.id === "saveSettings") {
          state.data.settings.budget =
            Number(document.getElementById("budgetInput").value) || 700;
          document
            .querySelectorAll("[data-team-name]")
            .forEach(
              (el) =>
                (state.data.teams[Number(el.dataset.teamName)].name =
                  el.value.trim() ||
                  `Squadra ${Number(el.dataset.teamName) + 1}`),
            );
          document
            .querySelectorAll("[data-slot]")
            .forEach(
              (el) =>
                (state.data.settings.slots[el.dataset.slot] =
                  Number(el.value) || 0),
            );
          save();
          render();
          toast("Configurazione salvata");
        }
        if (e.target.id === "addPlayer") {
          const name = document.getElementById("newName").value.trim();
          if (!name) {
            toast("Inserisci il nome");
            return;
          }
          state.data.players.push({
            id: `custom-${Date.now()}`,
            custom: true,
            role: document.getElementById("newRole").value,
            tier: document.getElementById("newTier").value,
            name: name.toUpperCase(),
            club: normalizeClubName(document.getElementById("newClub").value),
            credits:
              Number(document.getElementById("newCredits").value) || null,
            originalCredits: null,
            info: document.getElementById("newInfo").value.trim(),
            injuries: "",
            starter: "",
            recommended: "",
            franco: "",
            backup: "",
            pairing: "",
          });
          save();
          renderEditor();
          toast("Giocatore aggiunto");
        }
        if (e.target.id === "exportData") {
          const blob = new Blob([JSON.stringify(state, null, 2)], {
              type: "application/json",
            }),
            a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `fanta-asta-backup-${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(a.href);
        }
        if (
          e.target.id === "resetAuction" &&
          confirm("Azzerare tutti gli acquisti? Le liste resteranno intatte.")
        ) {
          state.purchases = {};
          state.history = [];
          save();
          render();
          toast("Asta azzerata");
        }
        if (e.target.id === "showAll") {
          ui.view = "lists";
          ui.onlyAvailable = false;
          render();
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "importData") {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const next = JSON.parse(reader.result);
              if (!next.data?.players || !next.data?.teams) throw Error();
              state = next;
              save();
              render();
              toast("Backup importato");
            } catch (err) {
              toast("Backup non valido");
            }
          };
          reader.readAsText(file);
        }
        if (e.target.id === "mdImport") {
          const file = e.target.files[0],
            role = document.getElementById("mdRole").value;
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const players = importMarkdownPlayers(reader.result, role);
              if (!players.length) throw Error("Nessun giocatore");
              if (
                !confirm(
                  `Sostituire ${ROLES[role]} con ${players.length} giocatori importati? Gli acquisti del ruolo verranno azzerati.`,
                )
              )
                return;
              const oldIds = new Set(
                state.data.players
                  .filter((p) => p.role === role)
                  .map((p) => p.id),
              );
              state.data.players = [
                ...state.data.players.filter((p) => p.role !== role),
                ...players,
              ];
              Object.keys(state.purchases).forEach((id) => {
                if (oldIds.has(id)) delete state.purchases[id];
              });
              state.history = state.history.filter(
                (h) => !oldIds.has(h.playerId),
              );
              save();
              renderEditor();
              toast(`${ROLES[role]} aggiornato: ${players.length} giocatori`);
            } catch (err) {
              toast(`Importazione fallita: ${err.message}`);
            }
          };
          reader.readAsText(file);
        }
      });
      document.querySelectorAll("dialog").forEach((d) =>
        d.addEventListener("click", (e) => {
          if (e.target === d) d.close();
        }),
      );
      if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      render();
    </script>
  </body>
</html>
